# Solo servicios de desarrollo. Las apps corren nativas (ver docs/decisiones/0011).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vianda
      POSTGRES_PASSWORD: vianda
      POSTGRES_DB: vianda
    ports:
      - '5432:5432'
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vianda -d vianda']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-datos:
